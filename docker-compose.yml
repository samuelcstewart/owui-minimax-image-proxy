# Local-dev compose for owui-minimax-image-proxy.
#
# Brings up this proxy PLUS a repo-owned stub that mimics the MiniMax
# API (`tests/stub_upstream.py`, served by python:3.14-slim on :9000).
# No real MiniMax account, API key, or external network is needed —
# `poe integration-test` runs the image-sanity suite against this
# stack.
#
# MiniMax has no /v1/images/generations (404) — only the native
# POST /v1/image_generation — which is exactly the gap this proxy
# fills for Open WebUI.
#
# Usage:
#   docker compose up -d --build      # dev stack (stub + proxy)
#   curl http://localhost:8000/health | jq
#   curl -X POST http://localhost:8000/images/generations \
#     -H 'Content-Type: application/json' \
#     -d '{"model":"image-01","prompt":"a red square on white","n":1,"size":"1024x1024","response_format":"b64_json"}' | jq '.data[0].b64_json | length'
#   docker compose down               # tear down
#
# Against the REAL MiniMax API instead: export MINIMAX_API_KEY and
# point the proxy at https://api.minimax.io/v1 (see the commented
# overrides below) — the key is never committed.

services:
  stub:
    image: python:3.14-slim-bookworm
    container_name: owui-minimax-image-dev-stub
    command: ["python3", "/stub/stub_upstream.py"]
    volumes:
      - ./tests:/stub:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/v1/models', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - owui-minimax-net

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: owui-minimax-image-dev-proxy
    depends_on:
      stub:
        condition: service_healthy
    environment:
      # Dummy key — the stub never checks it, but Settings requires a
      # non-empty MINIMAX_API_KEY to start.
      MINIMAX_API_KEY: stub-key-not-secret
      MINIMAX_API_BASE_URL: http://stub:9000/v1
      # Real-MiniMax overrides (use with a real key, stub not needed):
      # MINIMAX_API_KEY: ${MINIMAX_API_KEY:?MINIMAX_API_KEY must be set in the env — see README}
      # MINIMAX_API_BASE_URL: https://api.minimax.io/v1   # default
      # IMAGE_GEN_TIMEOUT_SECS: "120"                     # default
      # MAX_PROMPT_CHARS: "1500"                          # default
    ports:
      - "8000:8000"
    networks:
      - owui-minimax-net

networks:
  owui-minimax-net:
    driver: bridge
